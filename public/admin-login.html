<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Election System</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/notifications.css" />

    <style>
      :root {
        --bg-color: #0a0a0b;
        --card-bg: rgba(23, 23, 26, 0.8);
        --border-color: rgba(255, 255, 255, 0.08);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent-primary: #7c3aed; /* Purple for admin */
      }

      * {
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto,
          sans-serif;
        background-color: var(--bg-color);
        background-image:
          radial-gradient(
            circle at 50% 50%,
            rgba(124, 58, 237, 0.1) 0%,
            var(--bg-color) 100%
          ),
          url(images/bg.png);
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        color: var(--text-primary);
        overflow: hidden;
      }

      @keyframes cardEnter {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.98);
          filter: blur(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }

      .login-container {
        display: flex;
        flex-direction: column;
        background: var(--card-bg);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        padding: 48px;
        border-radius: 24px;
        border: 1px solid var(--border-color);
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 20px 25px -5px rgba(0, 0, 0, 0.2),
          inset 0 1px 1px rgba(255, 255, 255, 0.05);
        width: 100%;
        max-width: 440px;
        animation: cardEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        margin: 20px;
        position: relative;
        overflow: hidden;
      }

      .login-container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(
          90deg,
          var(--accent-primary),
          #3b82f6,
          var(--accent-primary)
        );
        border-radius: 24px 24px 0 0;
      }

      .login-container h2 {
        margin: 0 0 8px 0;
        color: var(--text-primary);
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.025em;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      .login-container p {
        color: var(--text-secondary);
        text-align: center;
        margin: 0 0 32px 0;
        font-size: 15px;
      }

      .input-container {
        position: relative;
        margin-bottom: 24px;
      }

      .input-container input {
        width: 100%;
        padding: 16px 48px 16px 20px;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        color: var(--text-primary);
        font-size: 16px;
        transition: all 0.3s ease;
        outline: none;
      }

      .input-container input:focus {
        border-color: var(--accent-primary);
        background: rgba(0, 0, 0, 0.3);
        box-shadow: 0 0 0 1px rgba(124, 58, 237, 0.2);
      }

      .input-container i {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-secondary);
        font-size: 18px;
        transition: color 0.3s ease;
        cursor: pointer;
      }

      .login-container button {
        background: var(--accent-primary);
        color: white;
        border: none;
        padding: 18px 24px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        width: 100%;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .login-container button:hover {
        background: #6d28d9;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -5px rgba(124, 58, 237, 0.4);
      }

      .login-container button:active {
        transform: translateY(0);
      }

      .admin-badge {
        background: rgba(124, 58, 237, 0.1);
        color: var(--accent-primary);
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .back-link {
        text-align: center;
        color: var(--text-secondary);
        font-size: 14px;
      }

      .back-link a {
        color: var(--accent-primary);
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s ease;
      }

      .back-link a:hover {
        color: #6d28d9;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="flex items-center justify-center gap-2 mb-4">
        <i class="fa-solid fa-shield-halved text-purple-500 text-2xl"></i>
        <span class="admin-badge">ADMIN</span>
      </div>

      <h2>Admin Portal</h2>
      <p>Secure access to election management system</p>

      <form id="adminLoginForm">
        <div class="input-container">
          <input
            type="tel"
            name="phoneNumber"
            id="phoneNumber"
            placeholder="Admin Phone Number"
            required
          />
          <i class="fa-solid fa-phone"></i>
        </div>

        <div class="input-container">
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Admin Password"
            required
          />
          <i class="fa-solid fa-lock" id="togglePassword"></i>
        </div>

        <button type="submit">
          <i class="fa-solid fa-sign-in-alt"></i>
          Login to Admin Panel
        </button>
      </form>

      <div class="back-link">
        <a href="/">← Back to Voter Login</a>
      </div>
    </div>

    <div class="toaster" id="toaster"></div>

    <!-- Scripts -->
    <script src="js/notifications.js"></script>
    <script>
      // Password visibility toggle
      const togglePassword = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("password");

      togglePassword.addEventListener("click", function () {
        const type = passwordInput.type === "password" ? "text" : "password";
        passwordInput.type = type;
        this.classList.toggle("fa-eye");
        this.classList.toggle("fa-eye-slash");
      });

      // Form submission
      document
        .getElementById("adminLoginForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const formData = new FormData(this);
          const data = Object.fromEntries(formData.entries());

          // Add loading state
          const btn = this.querySelector('button[type="submit"]');
          const originalText = btn.innerHTML;
          btn.innerHTML =
            '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';
          btn.disabled = true;

          try {
            const response = await fetch("/admin/login", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(data),
            });

            const result = await response.json();

            if (response.ok) {
              showToast("Login successful! Redirecting...", "success");
              console.log(
                "Login successful, redirecting to admin dashboard...",
              );
              setTimeout(() => {
                window.location.href = "/admin-dashboard.html";
              }, 2000);
            } else {
              showToast(result.message || "Login failed", "error");
            }
          } catch (error) {
            showToast("Connection error. Please try again.", "error");
          } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
          }
        });
    </script>
  </body>
</html>
