<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Leadership Portal</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- Maintaining external CSS linkage -->
    <link rel="stylesheet" href="css/notifications.css" />

    <style>
      :root {
        --bg-color: #0a0a0b;
        --card-bg: rgba(23, 23, 26, 0.8);
        --border-color: rgba(255, 255, 255, 0.08);
        --input-bg: rgba(0, 0, 0, 0.2);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent-primary: #3b82f6; /* Steel Blue */
        --accent-success: #10b981; /* Sage Emerald */
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto,
          sans-serif;
        background-color: var(--bg-color);
        /* Utilizing user's bg.png but with a premium overlay */
        background-image:
          radial-gradient(
            circle at 50% 50%,
            rgba(15, 23, 42, 0.5) 0%,
            var(--bg-color) 100%
          ),
          url(images/bg.png);
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        color: var(--text-primary);
        overflow: hidden;
      }

      /* Animation: Initial Load */
      @keyframes cardEnter {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.98);
          filter: blur(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }

      .login-container {
        display: flex;
        flex-direction: column;
        background: var(--card-bg);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        padding: 40px;
        border-radius: 20px;
        border: 1px solid var(--border-color);
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 20px 25px -5px rgba(0, 0, 0, 0.2),
          inset 0 1px 1px rgba(255, 255, 255, 0.05);
        width: 100%;
        max-width: 400px;
        animation: cardEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        margin: 20px;
      }

      .login-container h2 {
        margin: 0 0 32px 0;
        color: var(--text-primary);
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.025em;
        text-align: center;
      }

      .login-container form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* High-end Input Styling */
      .login-container input[type="text"],
      .login-container input[type="tel"],
      .login-container input[type="password"] {
        width: 100%;
        padding: 12px 16px;
        background: var(--input-bg);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        color: var(--text-primary);
        font-size: 15px;
        transition: var(--transition);
        outline: none;
      }

      .login-container input:focus {
        border-color: var(--accent-primary);
        background: rgba(0, 0, 0, 0.4);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
      }

      .login-container input::placeholder {
        color: var(--text-secondary);
        opacity: 0.6;
      }

      /* Existing input-container structure preserved for JS toggle logic */
      .input-container {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
      }

      .input-container i {
        position: absolute;
        right: 14px;
        /* Aligned to the bottom password input */
        bottom: 14px;
        cursor: pointer;
        color: var(--text-secondary);
        transition: var(--transition);
        z-index: 10;
        padding: 4px;
      }

      .input-container i:hover {
        color: var(--text-primary);
        transform: scale(1.1);
      }

      /* Buttons: Premium Interaction */
      .login-container button {
        width: 100%;
        padding: 12px;
        background-color: var(--accent-success);
        border: none;
        border-radius: 10px;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        margin-top: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-container button:hover {
        background-color: #059669; /* Slightly darker emerald */
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
      }

      .login-container button:active {
        transform: translateY(0);
      }

      .register-button {
        margin-top: 12px !important;
        background-color: transparent !important;
        border: 1px solid var(--border-color) !important;
        color: var(--text-secondary) !important;
        font-weight: 500 !important;
      }

      .register-button:hover {
        background-color: rgba(255, 255, 255, 0.03) !important;
        border-color: rgba(255, 255, 255, 0.2) !important;
        color: var(--text-primary) !important;
        box-shadow: none !important;
      }

      a {
        text-decoration: none;
      }

      /* Premium Toast/Notifications */
      .toaster {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .toast {
        background: rgba(23, 23, 23, 0.9);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        padding: 14px 24px;
        border-radius: 12px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        font-size: 14px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0;
        transform: translateX(20px);
        animation: toastIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .toast.success {
        border-left: 4px solid var(--accent-success);
      }

      @keyframes toastIn {
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      /* Mobile Adjustments */
      @media (max-width: 480px) {
        .login-container {
          padding: 30px 20px;
          margin: 16px;
          border-radius: 16px;
        }

        .login-container h2 {
          font-size: 20px;
          margin-bottom: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h2>Vote for Your Leader</h2>
      <form id="loginForm" action="/login" method="POST">
        <!-- Kept original structure & required attributes -->
        <!-- <input type="text" placeholder="Full Staff's Name" required /> -->

        <div class="input-container">
          <input
            type="tel"
            name="phoneNumber"
            id="phoneNumber"
            placeholder="Phone Number"
            required
          />
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
          />
          <!-- ID 'togglePassword' preserved for external JS -->
          <i class="fa-solid fa-eye" id="togglePassword"></i>
        </div>

        <button type="submit">Login to Account</button>
      </form>

      <a href="signup.html">
        <button class="register-button">Voter Registration</button>
      </a>
    </div>

    <!-- Toast container preserved for existing logic -->
    <div class="toaster" id="toaster"></div>

    <!-- External Logic Scripts (Untouched) -->
    <script src="js/notifications.js"></script>
    <script src="../toggle_password.js"></script>

    <script>
      /**
       * Displays a custom toast notification.
       * Logic preserved exactly as original to ensure compatibility.
       */
      function showToast(message, type = "success") {
        const toaster = document.getElementById("toaster");
        const toast = document.createElement("div");
        toast.className = "toast " + type;

        // Added a checkmark icon for premium feel while maintaining text logic
        toast.innerHTML =
          (type === "success"
            ? '<i class="fa-solid fa-circle-check" style="color:#10b981"></i>'
            : "") +
          "<span>" +
          message +
          "</span>";

        toaster.appendChild(toast);

        // Auto-remove logic preserved
        setTimeout(() => {
          toast.style.animation = "toastIn 0.5s reverse forwards";
          setTimeout(() => toast.remove(), 500);
        }, 4000);
      }

document.addEventListener("DOMContentLoaded", () => {
        // Handle login form submission
        document.getElementById("loginForm").addEventListener("submit", async function(event) {
          event.preventDefault();
          
          const formData = new FormData(this);
          const data = Object.fromEntries(formData.entries());
          
          // Add loading state to button
          const btn = this.querySelector('button[type="submit"]');
          const originalText = btn.innerHTML;
          btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Logging in...';
          btn.disabled = true;
          
          try {
            const response = await fetch("/login", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
              },
              body: JSON.stringify(data)
            });
            
            const result = await response.json();
            
            if (response.ok) {
              // Store user data in local storage
              localStorage.setItem('userToken', result.token);
              localStorage.setItem('userData', JSON.stringify(result.user));
              
              showToast("Login successful! Redirecting...", "success");
              
              // Redirect to home page
              setTimeout(() => {
                window.location.href = "/home.html";
              }, 1500);
            } else {
              showToast(result.message, "error");
            }
          } catch (error) {
            showToast("Connection error. Please try again.", "error");
          } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
          }
        });
      });
    </script>
  </body>
</html>
