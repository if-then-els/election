<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Registration | Election Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #0a0a0b 0%, #1a1a2e 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fafafa;
      }
      .register-container {
        background: rgba(24, 24, 27, 0.8);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 48px;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
      }
      .logo {
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
      }
      h1 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 8px; }
      .subtitle { color: #71717a; text-align: center; margin-bottom: 32px; font-size: 14px; }
      .form-group { margin-bottom: 20px; }
      label { display: block; font-size: 13px; color: #a1a1aa; margin-bottom: 8px; font-weight: 500; }
      input {
        width: 100%;
        padding: 14px 16px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: #fafafa;
        font-size: 15px;
        transition: all 0.2s;
      }
      input:focus { outline: none; border-color: #3b82f6; background: rgba(0, 0, 0, 0.4); }
      .secret-key { background: rgba(139, 92, 246, 0.1); border-color: rgba(139, 92, 246, 0.3); }
      .btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        border: none;
        border-radius: 12px;
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        margin-top: 8px;
      }
      .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
      .toast {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 14px 20px;
        border-radius: 12px;
        background: rgba(24, 24, 27, 0.95);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fafafa;
        font-size: 14px;
        z-index: 1000;
        display: none;
      }
      .toast.success { border-color: #10b981; }
      .toast.error { border-color: #ef4444; }
      .login-link { text-align: center; margin-top: 24px; font-size: 14px; color: #71717a; }
      .login-link a { color: #3b82f6; text-decoration: none; font-weight: 500; }
      .login-link a:hover { text-decoration: underline; }
      .hint { font-size: 11px; color: #71717a; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div id="toast"></div>

    <div class="register-container">
      <div class="logo">
        <i class="fa-solid fa-shield-halved text-white text-2xl"></i>
      </div>
      <h1>Create Admin Account</h1>
      <p class="subtitle">Register as an election administrator</p>

      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" name="phoneNumber" placeholder="e.g., 0712345678" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="Create a secure password" required>
        </div>
        <div class="form-group">
          <label>Admin Secret Key</label>
          <input type="password" name="secretKey" class="secret-key" placeholder="Enter admin secret key" required>
          <p class="hint">Contact system administrator for the secret key</p>
        </div>
        <button type="submit" class="btn" id="submitBtn">Create Admin Account</button>
      </form>

      <p class="login-link">Already have an admin account? <a href="admin-login.html">Sign in</a></p>
    </div>

    <script>
      function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast ${type}`;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 4000);
      }

      document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Creating account...';

        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());

        try {
          const res = await fetch('/register-admin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          const result = await res.json();

          if (res.ok && result.success) {
            showToast(result.message, 'success');
            setTimeout(() => window.location.href = '/admin-login.html', 2000);
          } else {
            showToast(result.message || 'Registration failed', 'error');
          }
        } catch (err) {
          showToast('Connection error', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = originalText;
        }
      });
    </script>
  </body>
</html>
