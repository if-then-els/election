<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Leadership Portal</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Preserved external links -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/notifications.css" />

    <style>
      :root {
        --bg-color: #0a0a0b;
        --card-bg: rgba(23, 23, 26, 0.8);
        --border-color: rgba(255, 255, 255, 0.08);
        --input-bg: rgba(0, 0, 0, 0.2);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent-emerald: #10b981;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto,
          sans-serif;
        background-color: var(--bg-color);
        background-image: radial-gradient(
          circle at 50% 50%,
          rgba(15, 23, 42, 0.5) 0%,
          var(--bg-color) 100%
        );
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        color: var(--text-primary);
        overflow-x: hidden;
      }

      @keyframes cardEnter {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.98);
          filter: blur(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }

      .signup-container {
        display: flex;
        flex-direction: column;
        background: var(--card-bg);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        padding: 40px;
        border-radius: 20px;
        border: 1px solid var(--border-color);
        box-shadow:
          0 20px 25px -5px rgba(0, 0, 0, 0.3),
          inset 0 1px 1px rgba(255, 255, 255, 0.05);
        width: 100%;
        max-width: 400px;
        animation: cardEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        margin: 20px;
      }

      .signup-container h2 {
        margin: 0 0 8px 0;
        color: var(--text-primary);
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.025em;
        text-align: center;
      }

      .sub-header {
        text-align: center;
        color: var(--text-secondary);
        font-size: 14px;
        margin-bottom: 32px;
      }

      .signup-container form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .signup-container input {
        width: 100%;
        padding: 12px 16px;
        background: var(--input-bg);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        color: var(--text-primary);
        font-size: 15px;
        transition: var(--transition);
        outline: none;
      }

      .signup-container input:focus {
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(0, 0, 0, 0.4);
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.03);
      }

      .signup-container button {
        width: 100%;
        padding: 12px;
        background-color: var(--text-primary);
        border: none;
        border-radius: 10px;
        color: var(--bg-color);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        margin-top: 8px;
      }

      .signup-container button:hover {
        background-color: #fff;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
      }

      .login-link {
        margin-top: 24px;
        text-align: center;
        font-size: 14px;
        color: var(--text-secondary);
      }

      .login-link a {
        color: var(--text-primary);
        text-decoration: none;
        font-weight: 500;
        margin-left: 4px;
        transition: var(--transition);
      }

      .login-link a:hover {
        opacity: 0.8;
      }

      /* Premium Toaster Override */
      .toaster {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 9999;
      }

      .toast {
        background: rgba(23, 23, 23, 0.95);
        backdrop-filter: blur(8px);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        padding: 12px 24px;
        border-radius: 12px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        font-size: 14px;
        margin-top: 10px;
        animation: toastIn 0.4s ease forwards;
      }

      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateX(20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @media (max-width: 480px) {
        .signup-container {
          padding: 32px 24px;
          margin: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="signup-container">
      <h2>Create Account</h2>
      <p class="sub-header">Join the leadership voting platform</p>

      <form action="/register" method="POST">
        <!-- Name attributes preserved for backend -->
        <input type="text" name="name" placeholder="Full Staff Name" required />
        <input
          type="email"
          name="email"
          placeholder="Official Email Address"
          required
        />

        <div style="position: relative">
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Secure Password"
            required
          />
          <!-- Eye icon commented out as per original code, but ready for logic if needed -->
          <!-- <i class="fa-solid fa-eye" id="togglePassword"></i> -->
        </div>

        <button type="submit">Complete Registration</button>

        <div class="login-link">
          Already registered? <a href="yet.html">Sign in</a>
        </div>
      </form>
    </div>

    <!-- Preserved ID for notification logic -->
    <div class="toaster" id="toaster"></div>

    <!-- Preserved external script connections -->
    <script src="../toggle_password.js"></script>
    <script src="js/notifications.js"></script>

    <script>
      /**
       * Enhanced Toast UI while maintaining logic compatibility
       */
      function showToast(message, type = "success") {
        const toaster = document.getElementById("toaster");
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;

        const icon =
          type === "success" ? "fa-circle-check" : "fa-circle-exclamation";
        const iconColor = type === "success" ? "#10b981" : "#ef4444";

        toast.innerHTML = `<i class="fa-solid ${icon}" style="color:${iconColor}; margin-right: 10px;"></i> ${message}`;
        toaster.appendChild(toast);

        setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transform = "translateX(20px)";
          toast.style.transition = "0.4s ease";
          setTimeout(() => toast.remove(), 400);
        }, 4000);
      }

      /**
       * Form Submission Logic - Preserved exactly as original
       */
      document
        .querySelector("form")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          // Premium loading state feedback
          const btn = this.querySelector("button");
          const originalText = btn.textContent;
          btn.textContent = "Creating account...";
          btn.disabled = true;

          const formData = new FormData(this);
          const data = Object.fromEntries(formData.entries());

          try {
            const response = await fetch("/register", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(data),
            });

            const result = await response.json();
            if (response.ok) {
              showToast(result.message, "success");
            } else {
              showToast(result.message, "error");
            }
          } catch (error) {
            showToast("A connection error occurred", "error");
          } finally {
            btn.textContent = originalText;
            btn.disabled = false;
          }
        });
    </script>
  </body>
</html>
